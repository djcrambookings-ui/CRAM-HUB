<title>Chief Fryom Dogman Goes Fishing</title>
<style>
  :root{
    --paper:#f5f0e3;
    --ink:#3a2f28;
    --brown:#8a4a2a;
    --brown-dk:#6d3820;
    --magenta:#c0208f;
    --frame-bg:#d8cfae;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){ --frame-bg:#161a20; --paper:#f2ecdd; }
  }
  :root[data-theme="dark"]{ --frame-bg:#161a20; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--frame-bg);
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:22px;
  }
  .card{
    width:min(940px,100%);
    background:
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(0,0,0,.03) 39px 40px),
      var(--paper);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.06);
    padding:16px 16px 18px; position:relative;
  }
  .card::before,.card::after{
    content:""; position:absolute; top:-9px; width:80px; height:22px;
    background:rgba(226,210,120,.55); box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .card::before{ left:32px; transform:rotate(-4deg); }
  .card::after { right:32px; transform:rotate(3deg); }

  .titlebar{ display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin:2px 6px 10px; }
  h1{
    font-family:"Comic Sans MS","Marker Felt","Chalkboard SE",cursive;
    color:var(--magenta); font-size:clamp(21px,4.3vw,38px);
    margin:0; line-height:1; letter-spacing:.5px; text-transform:uppercase;
    text-shadow:1.5px 1.5px 0 rgba(0,0,0,.10); text-wrap:balance;
  }
  .byline{ font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brown-dk); opacity:.85; white-space:nowrap; }

  .stage-wrap{ position:relative; border-radius:10px; overflow:hidden;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.10); }
  svg.stage{ display:block; width:100%; height:auto; }

  .status{
    position:absolute; left:50%; top:12px; transform:translateX(-50%);
    font-family:"Comic Sans MS","Marker Felt",cursive; font-size:clamp(15px,2.5vw,23px);
    color:#fff; -webkit-text-stroke:1px rgba(0,0,0,.35);
    text-shadow:2px 2px 0 rgba(0,0,0,.18); white-space:nowrap; pointer-events:none;
  }

  .footnote{ margin:11px 8px 2px; font-size:12.5px; color:var(--brown-dk);
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .replay{ background:none; border:1.5px dashed var(--brown); color:var(--brown-dk);
    font:inherit; font-size:12px; padding:3px 10px; border-radius:20px; cursor:pointer; }
  .replay:hover{ background:rgba(138,74,42,.08); }
  .replay:focus-visible{ outline:2px solid var(--magenta); outline-offset:2px; }

  @media (prefers-reduced-motion:reduce){ .noreduce{ animation:none !important; } }
</style>

<div class="card">
  <div class="titlebar">
    <h1>Chief Fryom Dogman<br>Goes Fishing</h1>
    <span class="byline">From the original drawing</span>
  </div>

  <div class="stage-wrap">
    <div class="status" aria-hidden="true"><b id="statusText">Down by the lake…</b></div>

    <svg class="stage" viewBox="0 0 900 600" role="img"
         aria-label="Chief Fryom Dogman, the marker drawing, casts a line into the lake, a fish bites, and he reels it in.">
      <defs>
        <filter id="wob" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe6f2"/><stop offset="1" stop-color="#eaf6d9"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#57c4d8"/><stop offset="1" stop-color="#166b83"/>
        </linearGradient>
        <g id="fishShape">
          <path d="M0,0 C14,-13 40,-13 56,0 C40,13 14,13 0,0 Z" fill="#e88b2a" stroke="#3a2f28" stroke-width="2.4"/>
          <path d="M56,0 L74,-13 L74,13 Z" fill="#e88b2a" stroke="#3a2f28" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M24,-9 L34,-19 L40,-7" fill="#f0a94a" stroke="#3a2f28" stroke-width="2"/>
          <circle cx="14" cy="-2" r="3.4" fill="#fff" stroke="#3a2f28" stroke-width="1.6"/>
          <circle cx="13" cy="-2" r="1.6" fill="#3a2f28"/>
        </g>
      </defs>

      <!-- SKY -->
      <rect x="0" y="0" width="900" height="360" fill="url(#sky)"/>
      <g filter="url(#wob)">
        <circle cx="770" cy="78" r="40" fill="#f4d35e" stroke="#e0b83e" stroke-width="3"/>
        <g stroke="#f4d35e" stroke-width="6" stroke-linecap="round">
          <line x1="770" y1="14" x2="770" y2="0"/><line x1="832" y1="78" x2="852" y2="78"/>
          <line x1="815" y1="33" x2="828" y2="20"/><line x1="815" y1="123" x2="828" y2="136"/>
        </g>
      </g>
      <g fill="#fff" opacity=".85" filter="url(#wob)">
        <g class="cloud noreduce">
          <ellipse cx="250" cy="70" rx="42" ry="19"/><ellipse cx="288" cy="64" rx="30" ry="17"/><ellipse cx="220" cy="66" rx="25" ry="14"/>
        </g>
        <g class="cloud2 noreduce">
          <ellipse cx="560" cy="46" rx="34" ry="14"/><ellipse cx="592" cy="42" rx="24" ry="12"/>
        </g>
      </g>

      <!-- WATER (right side of the shore) -->
      <path d="M300,318 C360,300 430,300 470,316 L900,316 L900,600 L300,600 Z" fill="url(#water)"/>
      <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".45" filter="url(#wob)">
        <path d="M520,360 q18,-7 36,0 t36,0"/><path d="M700,392 q18,-7 36,0 t36,0"/>
        <path d="M470,470 q18,-7 36,0 t36,0"/><path d="M680,520 q18,-7 36,0 t36,0"/>
        <path d="M540,560 q18,-7 36,0 t36,0"/>
      </g>

      <!-- deep fish -->
      <g id="fish" transform="translate(870,530) scale(-1,1)"><use href="#fishShape"/></g>

      <!-- GRASSY BANK (left) drawn over the water edge -->
      <g filter="url(#wob)">
        <path d="M0,300 C120,292 240,300 330,320 C360,360 350,520 360,600 L0,600 Z" fill="#7bbb3f"/>
        <path d="M0,300 C120,292 240,300 330,320" fill="none" stroke="#5f9a2e" stroke-width="4"/>
        <g stroke="#4f8a24" stroke-width="3" stroke-linecap="round">
          <path d="M60,306 l-4,-14"/><path d="M120,304 l3,-14"/><path d="M210,306 l-3,-14"/><path d="M290,314 l4,-13"/>
        </g>
      </g>

      <!-- ROD + LINE (over everything) -->
      <g id="rod" filter="url(#wob)">
        <line id="rodStick" x1="373" y1="338" x2="502" y2="185"
              stroke="#5a3418" stroke-width="5" stroke-linecap="round"/>
        <circle id="rodReel" cx="392" cy="330" r="6" fill="#3a2f28"/>
        <circle id="rodTipDot" cx="502" cy="185" r="3" fill="#3a2f28"/>
      </g>
      <path id="line" d="M502,185 C560,220 620,320 660,430" fill="none" stroke="#2a2a2a" stroke-width="1.6" opacity=".85"/>

      <g id="bobber" transform="translate(660,430)">
        <circle r="8" fill="#e23b3b" stroke="#3a2f28" stroke-width="2"/>
        <path d="M-8,0 h16" stroke="#3a2f28" stroke-width="2"/>

        <g transform="translate(-30,6) scale(0.9)"><use href="#fishShape"/></g>
      </g>
      <g id="splash" transform="translate(660,430)" opacity="0"
         stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-2,-6 v-14"/><path d="M-16,-2 l-12,-8"/><path d="M12,-2 l12,-8"/>

  <div class="footnote">
    <span>The real marker drawing, cut out and sent fishing. 🎣</span>
    <button class="replay" id="replayBtn" type="button">Replay the cast ↻</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  var HAND={x:373,y:338}, RODLEN=200;
  var HOLD={x:520,y:210}, CAST={x:672,y:430};
  var line=document.getElementById("line"),
      bobber=document.getElementById("bobber"),
      splash=document.getElementById("splash"),
      fish=document.getElementById("fish"),
      caught=document.getElementById("caughtFish"),
      rodStick=document.getElementById("rodStick"),
      rodTipDot=document.getElementById("rodTipDot"),
      chief=document.getElementById("chief"),
      statusEl=document.getElementById("statusText");

  var CYCLE=12000, startOffset=0;
  function lerp(a,b,t){return a+(b-a)*t;}
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function tip(angleDeg){
    var a=angleDeg*Math.PI/180;
    return {x:HAND.x+RODLEN*Math.cos(a), y:HAND.y+RODLEN*Math.sin(a)};
  }
  function drawLine(t,bx,by,sag){
    var mx=(t.x+bx)/2, my=(t.y+by)/2+(sag||0);
    line.setAttribute("d","M"+t.x+","+t.y+" Q"+mx+","+my+" "+bx+","+by);
  }
  function setStatus(s){ if(statusEl.textContent!==s) statusEl.textContent=s; }

  function frame(now){
    var t=((((now-startOffset)%CYCLE)+CYCLE)%CYCLE)/CYCLE;
    var ang=-52, bx=HOLD.x, by=HOLD.y, sag=8, showSplash=0, showCaught=0;
    var fishX=880, fishY=530, fishFlip=-1, fishOp=1, lean=0, bob=Math.sin(now/700)*3;

    if(t<0.10){                       setStatus("Down by the lake…");
      ang=-52; bx=HOLD.x; by=HOLD.y;
    } else if(t<0.20){                 setStatus("Winding up…");
      var k=ease((t-0.10)/0.10); ang=lerp(-52,-88,k); lean=lerp(0,-4,k);
      var tp=tip(ang); bx=lerp(HOLD.x,tp.x,k); by=lerp(HOLD.y,tp.y,k); sag=-6;
    } else if(t<0.30){                 setStatus("Casting out! 🎣");
      var k2=ease((t-0.20)/0.10); ang=lerp(-88,-20,k2); lean=lerp(-4,3,k2);
      bx=lerp(HOLD.x,CAST.x,k2);
      by=lerp(HOLD.y,CAST.y,k2)-Math.sin(k2*Math.PI)*130;
      sag=lerp(-28,14,k2);
      if(k2>0.9) showSplash=(k2-0.9)/0.1;
    } else if(t<0.55){                 setStatus("Waiting for a bite…");
      ang=-30; bx=CAST.x; by=CAST.y+Math.sin(now/380)*3;
      var kf=(t-0.30)/0.25; fishX=lerp(890,CAST.x+64,ease(kf)); fishY=lerp(560,470,ease(kf));
    } else if(t<0.62){                 setStatus("A bite!! 🐟");
      ang=-30; var kb=(t-0.55)/0.07;
      bx=CAST.x; by=CAST.y+Math.min(kb*42,28)+Math.sin(now/60)*3;
      fishX=CAST.x+16; fishY=458; lean=Math.sin(now/70)*2;
    } else if(t<0.75){                 setStatus("Reel it in! 🎣");
      var kr=ease((t-0.62)/0.13); ang=lerp(-30,-84,kr); lean=lerp(0,-7,kr);
      var tp2=tip(ang); bx=lerp(CAST.x,tp2.x,kr); by=lerp(CAST.y,tp2.y,kr); sag=lerp(14,-18,kr);
      showCaught=1; fishOp=0;
    } else if(t<0.95){                 setStatus("Chief caught a fish! 🎉");
      ang=-84+Math.sin(now/120)*4; lean=-7+Math.sin(now/150)*1.5;
      var tp3=tip(ang); bx=tp3.x; by=tp3.y; sag=-18; showCaught=1; fishOp=0;
      bob=Math.sin(now/160)*4;
    } else {                           setStatus("Down by the lake…");
      var ke=(t-0.95)/0.05; ang=lerp(-84,-52,ke); lean=lerp(-7,0,ke);
      var tp4=tip(ang); bx=lerp(tp4.x,HOLD.x,ke); by=lerp(tp4.y,HOLD.y,ke);
      showCaught=1-ke; fishOp=0;
    }

    var tp=tip(ang);
    rodStick.setAttribute("x2",tp.x.toFixed(1)); rodStick.setAttribute("y2",tp.y.toFixed(1));
    rodTipDot.setAttribute("cx",tp.x.toFixed(1)); rodTipDot.setAttribute("cy",tp.y.toFixed(1));
    drawLine(tp,bx,by,sag);
    bobber.setAttribute("transform","translate("+bx.toFixed(1)+","+by.toFixed(1)+")");
    bobber.style.opacity = showCaught>0?String(1-showCaught):"1";
    caught.setAttribute("transform","translate("+bx.toFixed(1)+","+by.toFixed(1)+")");
    caught.setAttribute("opacity",String(showCaught));
    splash.setAttribute("opacity", showSplash?String(showSplash):"0");
    fish.setAttribute("opacity",String(fishOp));
    fish.setAttribute("transform","translate("+fishX.toFixed(1)+","+fishY.toFixed(1)+") scale("+fishFlip+",1)");
    chief.setAttribute("transform","rotate("+lean.toFixed(2)+" 243 565) translate(0,"+bob.toFixed(1)+")");

    raf=requestAnimationFrame(frame);
  }

  var raf;
  if(reduce){
    setStatus("Chief caught a fish! 🎉");
    var ang=-80, tp=tip(ang);
    rodStick.setAttribute("x2",tp.x); rodStick.setAttribute("y2",tp.y);
    rodTipDot.setAttribute("cx",tp.x); rodTipDot.setAttribute("cy",tp.y);
    caught.setAttribute("transform","translate("+tp.x+","+tp.y+")");
    caught.setAttribute("opacity","1"); bobber.style.opacity="0"; fish.setAttribute("opacity","0");
    drawLine(tp,tp.x,tp.y,-18);
    chief.setAttribute("transform","rotate(-6 243 565)");
  } else {
    raf=requestAnimationFrame(frame);
  }
  document.getElementById("replayBtn").addEventListener("click",function(){
    if(reduce) return; startOffset=performance.now();
  });
})();
</script>
